# Render blueprint — one-click deploy of the API + admin panel + Postgres.
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
services:
  - type: web
    name: milkymart-daily-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # External Postgres connection string (e.g. Neon — free and non-expiring).
      # Set this in the Render dashboard. The app auto-creates all tables and
      # seeds demo data on first boot, so a brand-new empty database just works.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true          # strong random secret, unique per deploy
      - key: ADMIN_EMAIL
        value: admin@milkymart.app
      - key: ADMIN_PASSWORD
        sync: false                  # Render prompts you to set this on deploy
      - key: NODE_VERSION
        value: "20"

      # ---- Optional integrations -------------------------------------------
      # Leave these blank and the app runs in demo mode (any 6-digit OTP,
      # instant wallet top-ups). Fill them in to go live — no code change needed.
      #
      # SMS OTP: set SMS_PROVIDER to "msg91" or "twilio", then its credentials.
      - key: SMS_PROVIDER
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Payments: set both keys to require a real Razorpay payment for top-ups.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Restrict browser callers (comma-separated). Blank = allow all.
      - key: CORS_ORIGINS
        sync: false
      # Firebase: the service-account JSON (raw or base64). Enables phone sign-in
      # verification and FCM push. Set in the Render dashboard, never in git.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

# Database is now an external, non-expiring Postgres (Neon/Supabase), set via the
# DATABASE_URL env var above — Render's free Postgres expires after ~30 days.
