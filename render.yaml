# Render blueprint — one-click deploy of the API + admin panel + Postgres.
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
services:
  - type: web
    name: milkymart-daily-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: milkymart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # strong random secret, unique per deploy
      - key: ADMIN_EMAIL
        value: admin@milkymart.app
      - key: ADMIN_PASSWORD
        sync: false                  # Render prompts you to set this on deploy
      - key: NODE_VERSION
        value: "20"

databases:
  - name: milkymart-db
    plan: free
